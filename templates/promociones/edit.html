{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="row">
    <div class="col-md-8 mx-auto">
        <h2>Editar: {{ promotion.title }}</h2>
        <div class="card">
            <div class="card-body">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary">Guardar cambios</button>
                    <a href="{% url 'dashboard' %}" class="btn btn-secondary">Cancelar</a>
                </form>
                <hr>
                <p class="text-muted small">
                    <strong>Slug:</strong> {{ promotion.slug }}<br>
                    <strong>Estado actual:</strong> {{ promotion.get_status_display }}
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
