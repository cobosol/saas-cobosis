{# Render reutilizable de un campo del formulario #}
<div class="mb-4">
    <label class="block text-sm font-medium text-gray-700 mb-1" for="{{ field.id_for_label }}">
        {{ field.label }}
    </label>
    {{ field }}
    {% if field.help_text %}
    <p class="text-xs text-gray-500 mt-1">{{ field.help_text|safe }}</p>
    {% endif %}
    {% if field.errors %}
    <p class="text-red-500 text-xs mt-1"><i class="fas fa-exclamation-circle mr-1"></i>{{ field.errors.0 }}</p>
    {% endif %}
</div>
